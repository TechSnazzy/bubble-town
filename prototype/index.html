<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6e3cf">
<title>Bubble Town</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#f6e3cf;font-family:ui-rounded,"Nunito",system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#view{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#scene{width:1600px;height:1100px;transform-origin:0 0}
#scene.smooth{transition:transform .55s ease}
svg{display:block}

/* ink style */
.ink *{stroke:#4a3150;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.ink .ne{stroke:none}

/* animation helpers */
.pose,.idle,.a-tail,.a-ear,.ring,.puff,.spark,.hint{transform-box:fill-box}
.pose,.idle{transform-origin:50% 100%}
.ring,.puff,.spark,.hint{transform-origin:center}
.a-hop{animation:hop 2.8s infinite}
.a-bob{animation:bob 1.7s ease-in-out infinite alternate}
.a-sway{animation:sway 2.2s ease-in-out infinite alternate}
.a-waddle{animation:waddle .9s ease-in-out infinite alternate}
.a-slide{animation:slide 4s ease-in-out infinite alternate}
.a-tree{animation:treesway 3.2s ease-in-out infinite alternate}
.a-tail{transform-origin:0% 100%;animation:tail .7s ease-in-out infinite alternate}
.a-ear{transform-origin:50% 100%;animation:ear 2.4s infinite}
.a-drop{animation:drop 1.1s linear infinite}
.carmove{animation:drive 16s linear infinite;--dx:1820px;--dy:910px}
.carmove.rev{animation-direction:reverse}

.found .idle{animation:none}
.found .pose{animation:celebrate .9s ease-out,dance 1s ease-in-out .9s infinite alternate}
.ring{animation:ringpop .35s ease-out both}
.spark{animation:spark .8s ease-out forwards}
.puff{animation:puff .6s ease-out forwards}
.hint{animation:hintpulse 1.2s ease-out 2}

@keyframes hop{0%,62%,100%{transform:translateY(0) scale(1,1)}70%{transform:translateY(0) scale(1.1,.86)}82%{transform:translateY(-16px) scale(.92,1.1)}92%{transform:translateY(0) scale(1.08,.92)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px) rotate(1.5deg)}}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes waddle{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes slide{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
@keyframes tail{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
@keyframes ear{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-14deg)}86%{transform:rotate(4deg)}94%{transform:rotate(-10deg)}}
@keyframes treesway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@keyframes drive{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(22px);opacity:0}}
@keyframes celebrate{0%{transform:translateY(0) scale(1)}25%{transform:translateY(-34px) scale(1.3) rotate(-10deg)}50%{transform:translateY(0) scale(.88,1.1)}70%{transform:translateY(-14px) scale(1.12) rotate(8deg)}100%{transform:translateY(0) scale(1)}}
@keyframes dance{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-8px) rotate(4deg)}}
@keyframes ringpop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
@keyframes puff{from{transform:scale(.3);opacity:.9}to{transform:scale(1.8);opacity:0}}
@keyframes hintpulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.3);opacity:0}}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(540deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

/* HUD */
.hud{position:fixed;z-index:5}
.top{top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
.pill{background:rgba(255,255,255,.9);border:3px solid #4a3150;border-radius:999px;padding:6px 14px;font-weight:800;color:#4a3150;font-size:17px}
.tray{left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;padding:8px;background:rgba(255,255,255,.92);border:3px solid #4a3150;border-radius:22px}
.card{flex:0 0 auto;width:66px;border:0;background:#fff6e8;border-radius:14px;padding:4px 2px 2px;display:flex;flex-direction:column;align-items:center;position:relative;font-family:inherit;color:#4a3150;cursor:pointer}
.card svg{width:54px;height:52px}
.card span{font-size:11px;font-weight:800;margin-top:1px}
.card .a-tail,.card .a-ear{animation:none}
.card.done svg{opacity:.3}
.card.done::after{content:"\2713";position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:30px;font-weight:900;color:#2fb360}
.win{position:fixed;inset:0;z-index:9;background:rgba(74,49,80,.55);display:flex;align-items:center;justify-content:center;overflow:hidden}
.win[hidden]{display:none}
.win .box{background:#fff;border:4px solid #4a3150;border-radius:28px;padding:26px 30px;text-align:center;color:#4a3150;animation:pop .5s ease-out both;max-width:80vw}
.win h1{margin:0 0 6px;font-size:30px}
.win p{margin:0 0 16px;font-size:18px}
.win button{font:inherit;font-weight:800;font-size:18px;padding:10px 22px;border-radius:999px;border:3px solid #4a3150;background:#ffd93d;color:#4a3150}
.conf{position:absolute;top:0;font-size:28px;animation:fall linear forwards}
</style>
</head>
<body>
<div id="view"><div id="scene"></div></div>
<div class="hud top"><div class="pill">Bubble Town</div><div class="pill" id="count">0 / 8</div></div>
<div class="hud tray" id="tray"></div>
<div class="win" id="win" hidden><div class="box"><h1>You found them all!</h1><p>Great looking!</p><button id="again">Play again</button></div></div>

(function(){

/* ---------- seeded random ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- isometric building ---------- */
function iso(b){
var x=b.x,y=b.y,a=b.a,h=b.h,fl=b.fl||2;
var T=[x,y-a/2],Rr=[x+a,y],B=[x,y+a/2],L=[x-a,y];
function up(p,d){return [p[0],p[1]-d]}
function P(pts){return pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')}
function lf(s,t){return [L[0]+s*(B[0]-L[0]),L[1]+s*(B[1]-L[1])-t*h]}
function rf(s,t){return [B[0]+s*(Rr[0]-B[0]),B[1]+s*(Rr[1]-B[1])-t*h]}
function win(f,s0,s1,t0,t1,col){return '<polygon points="'+P([f(s0,t0),f(s1,t0),f(s1,t1),f(s0,t1)])+'" fill="'+col+'" style="stroke-width:2.5"/>';}
var s='<polygon points="'+P([L,B,up(B,h),up(L,h)])+'" fill="'+b.left+'"/>';
s+='<polygon points="'+P([B,Rr,up(Rr,h),up(B,h)])+'" fill="'+b.right+'"/>';
s+='<polygon points="'+P([up(T,h),up(Rr,h),up(B,h),up(L,h)])+'" fill="'+b.top+'"/>';
for(var i=0;i<fl;i++){
 var t0=(i+.3)/fl,t1=(i+.78)/fl;
 s+=win(lf,.15,.4,t0,t1,'#cfeefa')+win(lf,.58,.83,t0,t1,'#cfeefa');
 if(i===0){s+=win(rf,.15,.4,.04,.62/fl,'#b07a52');}else{s+=win(rf,.15,.4,t0,t1,'#cfeefa');}
 s+=win(rf,.58,.83,t0,t1,'#cfeefa');
}
var tc=[x,y-h];
if(b.roof==='pyr'){
 var ap=[x,y-h-a*0.8],Lh=up(L,h),Bh=up(B,h),Rh=up(Rr,h);
 s+='<polygon points="'+P([Lh,Bh,ap])+'" fill="'+b.rl+'"/><polygon points="'+P([Bh,Rh,ap])+'" fill="'+b.rr+'"/>';
}else if(b.roof==='cupcake'){
 s+='<g transform="translate('+tc[0]+','+(tc[1]+4)+')"><path d="M-28 0 L-22 -34 L22 -34 L28 0 Z" fill="#ffd0e0"/><path d="M-9 -2 L-7 -33 M9 -2 L7 -33" fill="none" style="stroke-width:2"/><ellipse cx="0" cy="-38" rx="30" ry="13" fill="#ff8fab"/><circle cx="0" cy="-55" r="17" fill="#ff8fab"/><circle cx="0" cy="-74" r="6" fill="#e63946"/></g>';
}else if(b.roof==='cone'){
 s+='<g transform="translate('+tc[0]+','+(tc[1]+2)+')"><path d="M-18 -40 L0 0 L18 -40 Z" fill="#f2c27b"/><circle cx="0" cy="-48" r="21" fill="#ffb3c7"/><circle cx="0" cy="-72" r="14" fill="#c9f0e0"/><circle cx="0" cy="-88" r="5" fill="#e63946"/></g>';
}
return s;
}

{id:5,name:'Snail',fn:'snail',args:['#b57edc','#ffd6a5'],idle:'a-slide',x:935,y:845,cover:1},
{id:6,name:'Turtle',fn:'turtle',args:['#4cc38a','#9be8bf'],idle:'a-bob',x:420,y:1030,cover:1},
{id:7,name:'Fox',fn:'fox',args:['#ee6c4d'],idle:'a-sway',x:1450,y:565,cover:1}
];

var species={
frog:{idle:'a-hop',cols:[['#ff8fab','#ffd1dc'],['#7ec8ff','#d0ecff'],['#c9a0ff','#e8d9ff']]},
cat:{idle:'a-sway',cols:[['#9aa0a6','#e9ecef'],['#ffffff','#ffe3ec'],['#6b5b7b','#d9cde6']]},
duck:{idle:'a-bob',cols:[['#ffffff','#e6e6e6'],['#ffb3c7','#ff8fab'],['#9be8ff','#6fcfe8']]},
bunny:{idle:'a-hop',cols:[['#ffd6e0','#ff9fbf'],['#cdb4ff','#e7dcff'],['#c8e6ff','#9bd0f5']]},
penguin:{idle:'a-waddle',cols:[['#ff8fab'],['#7ed9c3'],['#ffc857']]},
snail:{idle:'a-slide',cols:[['#ff8fab','#ffd6a5'],['#7ec8ff','#ffd6a5'],['#7ed957','#ffe9a5']]},
turtle:{idle:'a-bob',cols:[['#ffb347','#ffe0a8'],['#7ec8ff','#cfeaff'],['#d49bff','#eddaff']]},
fox:{idle:'a-sway',cols:[['#8e7dbe'],['#6c757d'],['#ffffff']]}
};
var speciesNames=Object.keys(species);

/* ---------- helpers ---------- */
function actor(x,y,svg,idle,o){
 o=o||{};var s=o.s||1,fx=o.flip?-s:s;
 var d=-(R()*3).toFixed(2);
 return '<g transform="translate('+x.toFixed(1)+','+y.toFixed(1)+') scale('+fx+','+s+')"'+(o.id!=null?' data-t="'+o.id+'"':'')+'><g class="pose"><g class="idle '+idle+'" style="animation-delay:'+d+'s">'+svg+'</g></g></g>';
}
var items=[];
function add(y,s){items.push({y:y,s:s});}

function free(x,y){
 if(x<50||x>1550||y<110||y>1075)return false;
 if(Math.abs(y-roadCy(x))<112)return false;
 for(var i=0;i<blds.length;i++){var b=blds[i];
  if(x>b.x-b.a-24&&x<b.x+b.a+24&&y>b.y-b.h-b.a*0.9-10&&y<b.y+b.a/2+14)return false;}
 if(Math.pow((x-1150)/200,2)+Math.pow((y-250)/115,2)<1)return false;
 if(Math.pow((x-1100)/105,2)+Math.pow((y-1000)/55,2)<1)return false;
 for(var j=0;j<targets.length;j++){if(Math.hypot(x-targets[j].x,y-targets[j].y)<62)return false;}
 return true;
}
function spot(){for(var k=0;k<200;k++){var x=rr(60,1540),y=rr(120,1070);if(free(x,y))return [x,y];}return null;}

/* ---------- background ---------- */
var bg='<rect class="ne" width="'+W+'" height="'+H+'" fill="#f6e3cf"/>';
[[330,930,320,150],[1100,1010,250,95],[1150,255,235,130],[220,130,280,90],[900,160,200,70],[1450,760,150,90]].forEach(function(g){
 bg+='<ellipse class="ne" cx="'+g[0]+'" cy="'+g[1]+'" rx="'+g[2]+'" ry="'+g[3]+'" fill="#cdeba9"/>';});
bg+='<ellipse cx="1150" cy="250" rx="150" ry="75" fill="#8fd3e8"/><ellipse class="ne" cx="1120" cy="236" rx="85" ry="34" fill="#b4e8f5" opacity=".7"/>';
[[1060,266],[1130,280],[1215,226],[1245,272]].forEach(function(p){bg+='<ellipse cx="'+p[0]+'" cy="'+p[1]+'" rx="30" ry="11" fill="#5fc27a" style="stroke-width:2.5"/>';});
function rp(m){var x0=-60,x1=1660;return x0+','+(roadCy(x0)-m)+' '+x1+','+(roadCy(x1)-m)+' '+x1+','+(roadCy(x1)+m)+' '+x0+','+(roadCy(x0)+m);}
bg+='<polygon points="'+rp(90)+'" fill="#f1dcc6"/><polygon points="'+rp(70)+'" fill="#9c95aa"/>';
bg+='<line x1="-60" y1="'+roadCy(-60)+'" x2="1660" y2="'+roadCy(1660)+'" style="stroke:#fff;stroke-width:4;stroke-dasharray:22 18"/>';
[520,1180].forEach(function(x0){for(var i=0;i<6;i++){var xi=x0+i*30;bg+='<polygon class="ne" points="'+xi+','+(roadCy(xi)-62)+' '+(xi+16)+','+(roadCy(xi+16)-62)+' '+(xi+16)+','+(roadCy(xi+16)+62)+' '+xi+','+(roadCy(xi)+62)+'" fill="#fff" opacity=".85"/>';}});

/* ---------- cars ---------- */
var cars='';
var carDefs=[['#ffd93d',-1,0,16],['#ff8fab',-1,-8,16],['#7ec8ff',1,-3,18],['#ffffff',1,-12,18],['#7ed957',-1,-12,16]];
carDefs.forEach(function(c){
 var lane=c[1]*28,sx=-120,sy=roadCy(sx)+lane;
 cars+='<g transform="translate('+sx+','+(sy+14)+')"><g class="carmove'+(c[1]>0?' rev':'')+'" style="animation-delay:'+c[2]+'s;animation-duration:'+c[3]+'s"><g transform="skewY(26.57) scale('+(c[1]>0?-1:1)+',1)">'+S.car(c[0])+'</g></g></g>';
});

/* ---------- buildings ---------- */
blds.forEach(function(b){add(b.y+b.a/2,iso(b));});
add(1000,'<g transform="translate(1100,1000)">'+S.fountain()+'</g>');

/* ---------- lamps ---------- */
for(var lx=200;lx<1560;lx+=260){
 add(roadCy(lx)-96,'<g transform="translate('+lx+','+(roadCy(lx)-96)+')">'+S.lamp()+'</g>');
 var lx2=lx+130;add(roadCy(lx2)+104,'<g transform="translate('+lx2+','+(roadCy(lx2)+104)+')">'+S.lamp()+'</g>');
}

/* ---------- targets + bushes in front ---------- */
targets.forEach(function(t){
 add(t.y,actor(t.x,t.y,S[t.fn].apply(null,t.args),t.idle,{id:t.id}));
 if(t.cover){add(t.y+6,'<g transform="translate('+(t.x+rr(-8,8))+','+(t.y+6)+')">'+S.bush(pick(['#8fd36b','#6fc27a','#a6df7b']))+'</g>');}
});

/* ---------- scenery decoys ---------- */
var greens=['#8fd36b','#6fc27a','#a6df7b','#7bd18f'];
for(var i=0;i<20;i++){var p=spot();if(!p)continue;add(p[1],'<g transform="translate('+p[0].toFixed(1)+','+p[1].toFixed(1)+') scale('+rr(.9,1.25).toFixed(2)+')"><g class="pose a-tree" style="animation-delay:'+(-R()*3).toFixed(2)+'s">'+S.tree(pick(greens))+'</g></g>');}
for(i=0;i<20;i++){p=spot();if(!p)continue;add(p[1],'<g transform="translate('+p[0].toFixed(1)+','+p[1].toFixed(1)+') scale('+rr(.7,1).toFixed(2)+')">'+S.bush(pick(greens))+'</g>');}
var fcols=['#ff8fab','#ffd93d','#c9a0ff','#7ec8ff','#ffffff','#ffb347'];
for(i=0;i<55;i++){p=spot();if(!p)continue;add(p[1],'<g transform="translate('+p[0].toFixed(1)+','+p[1].toFixed(1)+')">'+S.flower(pick(fcols))+'</g>');}

/* ---------- people ---------- */
var skins=['#ffd8b8','#f2b48c','#c98a64','#8d5a3b'];
var shirts=['#ff8fab','#7ec8ff','#ffd93d','#7ed9c3','#c9a0ff','#ffb347','#ffffff'];
var hats=[null,null,'#e63946','#3a86ff','#ffbe0b','#8338ec'];
var hairs=['#4a3150','#8d5a3b','#f4a261',null];
for(i=0;i<28;i++){p=spot();if(!p)continue;
 add(p[1],actor(p[0],p[1],S.person(pick(skins),pick(shirts),pick(hats),pick(hairs)),pick(['a-sway','a-bob']),{s:rr(.9,1.1),flip:R()<.5}));}

/* ---------- decoy animals ---------- */
for(i=0;i<36;i++){p=spot();if(!p)continue;
 var sp=pick(speciesNames),def=species[sp],col=pick(def.cols);
 add(p[1],actor(p[0],p[1],S[sp].apply(null,col),def.idle,{s:rr(.85,1.05),flip:R()<.5}));}
/* ducks on the pond */
[[1090,235,0],[1200,250,1],[1160,215,2],[1235,235,0]].forEach(function(d){
 var c=species.duck.cols[d[2]];add(d[1],actor(d[0],d[1],S.duck.apply(null,c),'a-bob',{s:.8,flip:d[0]>1160}));});

/* ---------- assemble ---------- */
items.sort(function(a,b){return a.y-b.y});
var svg='<svg class="ink" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+bg+cars+items.map(function(i){return i.s}).join('')+'<g id="fx"></g></svg>';
var scene=document.getElementById('scene'),view=document.getElementById('view');
scene.innerHTML=svg;
var fx=document.getElementById('fx');
targets.forEach(function(t){t.el=scene.querySelector('[data-t="'+t.id+'"]');t.found=false;});

/* ---------- tray ---------- */
var tray=document.getElementById('tray'),countEl=document.getElementById('count'),count=0;
targets.forEach(function(t){
 var b=document.createElement('button');b.className='card';
 b.innerHTML='<svg class="ink" viewBox="-52 -90 104 96">'+S[t.fn].apply(null,t.args)+'</svg><span>'+t.name+'</span>';
 b.addEventListener('click',function(){hint(t);});
 t.card=b;tray.appendChild(b);
});

/* ---------- pan / zoom ---------- */
var sc=1,tx=0,ty=0;
function minScale(){return Math.max(view.clientWidth/W,view.clientHeight/H);}
function clamp(){
 var m=minScale();sc=Math.min(Math.max(sc,m),3);
 var vw=view.clientWidth,vh=view.clientHeight;
 tx=Math.min(0,Math.max(vw-W*sc,tx));ty=Math.min(0,Math.max(vh-H*sc,ty));
 scene.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')';
}
function zoomAt(px,py,ns){
 var m=minScale();ns=Math.min(Math.max(ns,m),3);
 tx=px-(px-tx)*ns/sc;ty=py-(py-ty)*ns/sc;sc=ns;clamp();
}
sc=Math.max(minScale(),0.9);tx=-(W*sc-view.clientWidth)/2;ty=-(H*sc-view.clientHeight)*0.3;clamp();
window.addEventListener('resize',clamp);

var ptrs=new Map(),moved=0,startT=0,lastDist=0;
function dist(){var a=Array.from(ptrs.values());return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;}
function mid(){var a=Array.from(ptrs.values());return [(a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2];}
view.addEventListener('pointerdown',function(e){
 view.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1){moved=0;startT=Date.now();}
 if(ptrs.size===2){lastDist=dist();moved=999;}
});
view.addEventListener('pointermove',function(e){
 var p=ptrs.get(e.pointerId);if(!p)return;
 var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(ptrs.size===1){moved+=Math.abs(dx)+Math.abs(dy);tx+=dx;ty+=dy;clamp();}
 else if(ptrs.size===2){var d=dist(),m=mid();zoomAt(m[0],m[1],sc*d/lastDist);lastDist=d;}
});
function up(e){
 var had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);
 if(had&&e.type==='pointerup'&&ptrs.size===0&&moved<12&&Date.now()-startT<600)tap(e.clientX,e.clientY);
}
view.addEventListener('pointerup',up);
view.addEventListener('pointercancel',up);
view.addEventListener('wheel',function(e){e.preventDefault();zoomAt(e.clientX,e.clientY,sc*(e.deltaY<0?1.12:1/1.12));},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});

/* ---------- game logic ---------- */
function tap(cx,cy){
 var r=scene.getBoundingClientRect();
 var x=(cx-r.left)/sc,y=(cy-r.top)/sc,best=null,bd=1e9;
 targets.forEach(function(t){if(t.found)return;var d=Math.hypot(x-t.x,y-(t.y-30));if(d<bd){bd=d;best=t;}});
 if(best&&bd<46)foundIt(best);else puff(x,y);
}
function puff(x,y){
 fx.insertAdjacentHTML('beforeend','<circle class="puff" cx="'+x+'" cy="'+y+'" r="16" fill="none" style="stroke:#ff8fab;stroke-width:4"/>');
 var el=fx.lastElementChild;setTimeout(function(){el.remove();},650);
}
function foundIt(t){
 t.found=true;t.el.classList.add('found');
 var cy=t.y-30,cols=['#ffd93d','#ff8fab','#7ec8ff','#7ed957'];
 fx.insertAdjacentHTML('beforeend','<circle class="ring" cx="'+t.x+'" cy="'+cy+'" r="44" fill="none" style="stroke:#35c46a;stroke-width:5"/>');
 for(var i=0;i<10;i++){var a=i/10*Math.PI*2;
  fx.insertAdjacentHTML('beforeend','<circle class="spark" cx="'+t.x+'" cy="'+cy+'" r="5" fill="'+cols[i%4]+'" style="--dx:'+(Math.cos(a)*64).toFixed(0)+'px;--dy:'+(Math.sin(a)*64).toFixed(0)+'px;stroke-width:1.5"/>');}
 setTimeout(function(){fx.querySelectorAll('.spark').forEach(function(e){e.remove();});},900);
 t.card.classList.add('done');count++;countEl.textContent=count+' / '+targets.length;
 if(count===targets.length)setTimeout(win,1200);
}
function hint(t){
 if(t.found)return;
 sc=Math.max(sc,1.2);var vw=view.clientWidth,vh=view.clientHeight;
 tx=vw/2-t.x*sc;ty=vh*0.42-t.y*sc;
 scene.classList.add('smooth');clamp();setTimeout(function(){scene.classList.remove('smooth');},600);
 fx.insertAdjacentHTML('beforeend','<circle class="hint" cx="'+t.x+'" cy="'+(t.y-30)+'" r="90" fill="none" style="stroke:#ffb400;stroke-width:6"/>');
 var el=fx.lastElementChild;setTimeout(function(){el.remove();},2500);
}
function win(){
 var w=document.getElementById('win');w.hidden=false;
 var em=['\u2B50','\uD83C\uDF88','\uD83C\uDF89','\uD83D\uDC38','\uD83D\uDC30','\uD83E\uDD86'];
 for(var i=0;i<30;i++){var s=document.createElement('span');s.className='conf';s.textContent=em[i%em.length];
  s.style.left=(Math.random()*100)+'vw';s.style.animationDuration=(2.5+Math.random()*2.5)+'s';s.style.animationDelay=(Math.random()*1.5)+'s';w.appendChild(s);}
}
document.getElementById('again').addEventListener('click',function(){location.reload();});
})();
</script>
</body>
</html>
